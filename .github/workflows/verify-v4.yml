name: Verify dense theme v4
on:
  push:
    branches: [main, work/v4-dense-2026-10-22]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run validate:data
      - run: npx tsc --noEmit
      - run: npm run build
