name: Manually refresh WordPress WXR and locked theme
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Update native WordPress content and theme from Next.js
        run: python scripts/build-fse-locked.py --repo . --theme-dir wordpress/forex-trade-technology --wxr-path website.xml --strict-assets
      - run: |
          php -l wordpress/forex-trade-technology/functions.php
          node --check wordpress/forex-trade-technology/assets/js/blocks.js
          git add -A -f -- website.xml wordpress/forex-trade-technology
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(fse): manual refresh of WordPress WXR and theme'
            git push origin HEAD:main
          fi
