name: WordPress staging theme activation
on:
  push:
    branches: [main]
    paths: ['wordpress/**','website.xml','.github/workflows/wordpress-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  theme-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start isolated WordPress environment
        run: npm install -g @wordpress/env@10.39.0
      - name: Boot WordPress and activate standalone theme
        working-directory: wordpress
        run: |
          wp-env start
          wp-env run cli wp theme activate forex-trade-technology
          wp-env run cli wp eval 'foreach(["container","link","inline-text","icon","faq-item","form-field","social-links","image","site-navigation","nav-link","nav-submenu"] as $n){if(!WP_Block_Type_Registry::get_instance()->is_registered("ftt/".$n)){throw new Exception("Missing block ".$n);}}echo "11 Gutenberg blocks registered";'
          curl --fail --silent --show-error http://localhost:8888/ > /tmp/ftt-wordpress-home.html
          grep -Eiq 'Forex|wp-site-blocks' /tmp/ftt-wordpress-home.html
      - name: Docker diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          docker ps -a --format '{{.ID}}' | while IFS= read -r id; do
            [ -n "$id" ] || continue
            docker logs --tail 60 "$id" 2>&1 || true
          done
