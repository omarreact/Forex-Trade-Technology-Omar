name: Synchronize locked WordPress theme and importable WXR
on:
  push:
    branches: [main, 'feat/ftt-exact-fse-tree-wxr-*']
    paths:
      - 'app/**'
      - 'lib/**'
      - 'content/**'
      - 'theme/**'
      - 'blocks/**'
      - 'patterns/**'
      - 'parts/**'
      - 'templates/**'
      - 'public/**'
      - 'scripts/build-fse-locked.py'
      - '.github/workflows/sync-fse-locked.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'content/**'
      - 'theme/**'
      - 'parts/**'
      - 'scripts/build-fse-locked.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ftt-fse-source-sync
  cancel-in-progress: false
jobs:
  build-and-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-image converter
        run: python -m pip install Pillow==11.3.0
      - name: Generate reference-architecture FSE theme and native WordPress WXR
        run: python scripts/build-fse-locked.py --repo . --theme-dir wordpress/forex-trade-technology --wxr-path website.xml --strict-assets
      - name: Verify exact 31-file theme, animated images, 11 blocks and 16 WXR page records
        run: |
          python - <<'PY'
          import runpy, pathlib, xml.etree.ElementTree as ET
          from PIL import Image
          ns=runpy.run_path('scripts/build-fse-locked.py')
          p=pathlib.Path('wordpress/forex-trade-technology')
          actual={f.relative_to(p).as_posix() for f in p.rglob('*') if f.is_file()}
          expect=set(ns['FILES'])
          assert actual==expect, f'Unexpected theme file paths: {actual^expect}'
          assert len(actual)==31 and len(ns['BLOCKS'])==11
          for filename in [x for x in expect if x.endswith('.gif')]:
              with Image.open(p/filename) as img:
                  assert img.n_frames >= 2, f'{filename} is not animated'
          xml=ET.parse('website.xml').getroot()
          assert xml.tag=='rss'
          assert len(xml.findall('./channel/item'))==16
          php=(p/'functions.php').read_text()
          assert "register_block_type('ftt/'.$name" in php
          assert "register_rest_route('ftt/v1','/contact'" in php and 'wp_mail(' in php
          assert 'ftt-brand-image' in (p/'parts/header.html').read_text()
          assert 'ftt-footer-image' in (p/'parts/footer.html').read_text()
          print('PASS: exactly 31 paths, 11 blocks, three animated GIFs, builtin contact handler, 16 WXR items')
          PY
      - name: Validate generated PHP and Gutenberg JavaScript
        run: |
          php -l wordpress/forex-trade-technology/functions.php
          node --check wordpress/forex-trade-technology/assets/js/blocks.js
          node --check wordpress/forex-trade-technology/assets/js/site-enhancements.js
      - name: Commit only theme directory and website.xml to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add -A -f -- wordpress/forex-trade-technology website.xml
          if git diff --cached --quiet; then
            echo 'Already synchronized.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(fse): synchronize locked theme and importable website.xml from Next.js'
          git push origin HEAD:main
