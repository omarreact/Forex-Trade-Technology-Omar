name: Deploy Next.js static preview to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "site-data/**"
      - "next.config.ts"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/nextjs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies without lockfile cache
        run: npm install --no-audit --no-fund
      - name: Prepare static-only build
        run: |
          # GitHub Pages cannot run the Vercel contact API route.
          rm -f app/api/contact/route.ts
      - name: Build static Next.js preview
        env:
          GITHUB_PAGES_EXPORT: "true"
          NEXT_PUBLIC_STATIC_EXPORT: "true"
        run: npm run build
      - name: Disable Jekyll processing
        run: touch out/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy static preview
        id: deployment
        uses: actions/deploy-pages@v5
