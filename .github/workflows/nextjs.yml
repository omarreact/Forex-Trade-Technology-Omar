name: Deploy Next.js static preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies without lockfile cache
        run: npm install --no-audit --no-fund
      - name: Prepare static-only build
        run: |
          # GitHub Pages cannot run the Vercel contact API route.
          rm -f app/api/contact/route.ts
      - name: Build static Next.js preview
        env:
          GITHUB_PAGES_EXPORT: "true"
          NEXT_PUBLIC_STATIC_EXPORT: "true"
        run: npm run build
      - name: Stamp built commit for deployment verification
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("out/release.json",JSON.stringify({branch:"main",commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString(),provider:"github-pages"}))'
      - name: Disable Jekyll processing
        run: touch out/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy static preview
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://omarreact.github.io/Forex-Trade-Technology-Omar/release.json"
          for attempt in $(seq 1 20); do
            published_sha=$(curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "${url}?check=${EXPECTED_SHA}-${attempt}" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).commit' || true)
            if [ "$published_sha" = "$EXPECTED_SHA" ]; then
              echo "GitHub Pages is serving this exact main commit: $EXPECTED_SHA"
              exit 0
            fi
            sleep 6
          done
          echo "::error::GitHub Pages is not yet serving this commit: $EXPECTED_SHA"
          exit 1

