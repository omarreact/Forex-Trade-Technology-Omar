name: WordPress Phase C package validation
on:
  pull_request:
    branches: [main]
    paths: ['wordpress/**','scripts/validate-wp-package.py','.github/workflows/wordpress-phase-c.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-lint-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax verification
        run: find wordpress -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Distribution and content contract verification
        run: python3 scripts/validate-wp-package.py
      - name: Assemble theme and plugin ZIPs
        run: |
          mkdir -p artifacts/wordpress
          cd wordpress
          zip -qr ../artifacts/wordpress/forex-trade-technology-theme.zip forex-trade-technology
          zip -qr ../artifacts/wordpress/forex-trade-technology-contact-plugin.zip forex-contact
      - uses: actions/upload-artifact@v4
        with:
          name: forex-wordpress-installables
          path: artifacts/wordpress/*.zip
