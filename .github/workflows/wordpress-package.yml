name: WordPress Phase C package and syntax verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'wordpress/**'
      - 'scripts/validate-wordpress-package.mjs'
      - '.github/workflows/wordpress-package.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/**'
      - 'scripts/validate-wordpress-package.mjs'
      - '.github/workflows/wordpress-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-wordpress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP version
        run: php -v
      - name: Lint every PHP file
        run: find wordpress -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check Gutenberg and frontend JavaScript
        run: |
          node --check wordpress/forex-trade-technology/assets/js/editor.js
          node --check wordpress/forex-trade-technology/assets/js/front.js
      - name: Verify Phase B → WordPress migration contracts
        run: node scripts/validate-wordpress-package.mjs
      - name: Build independently installable ZIPs
        working-directory: wordpress
        run: |
          zip -q -r forex-trade-technology-theme.zip forex-trade-technology -x '*.DS_Store'
          zip -q -r forex-trade-technology-contact-plugin.zip forex-trade-technology-contact -x '*.DS_Store'
          unzip -t forex-trade-technology-theme.zip | tail -1
          unzip -t forex-trade-technology-contact-plugin.zip | tail -1
      - name: Upload both installation packages
        uses: actions/upload-artifact@v4
        with:
          name: forex-trade-technology-wordpress-phase-c
          path: |
            wordpress/forex-trade-technology-theme.zip
            wordpress/forex-trade-technology-contact-plugin.zip
          retention-days: 90
