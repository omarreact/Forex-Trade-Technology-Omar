name: WordPress locked structure and syntax checks (no ZIP)
on:
  push:
    branches: [main]
    paths: ['wordpress/**','website.xml','.github/workflows/wordpress-package.yml','scripts/validate-wordpress-package.mjs']
  pull_request:
    branches: [main]
    paths: ['wordpress/**','website.xml','.github/workflows/wordpress-package.yml','scripts/validate-wordpress-package.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-fse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tree, WordPress content and assets
        run: node scripts/validate-wordpress-package.mjs
      - name: Check theme PHP and JavaScript
        run: |
          php -l wordpress/forex-trade-technology/functions.php
          node --check wordpress/forex-trade-technology/assets/js/blocks.js
          node --check wordpress/forex-trade-technology/assets/js/site-enhancements.js
