<form class="bs-contact-form" method="post" novalidate><div class="bs-form-head"><span>LET’S TALK</span><span>↗</span></div>
<div class="bs-form-row"><label>YOUR NAME *<input name="name" required minlength="2" maxlength="100" autocomplete="name" placeholder="Full name"></label><label>BUSINESS EMAIL *<input name="email" type="email" required maxlength="150" autocomplete="email" placeholder="you@company.com"></label></div>
<div class="bs-form-row"><label>COMPANY<input name="company" maxlength="120" placeholder="Company name"></label><label>COUNTRY<input name="country" maxlength="100" autocomplete="country-name" placeholder="Your country"></label></div>
<label>PHONE / WHATSAPP<input name="contact" maxlength="100" autocomplete="tel" placeholder="Preferred number"></label>
<div class="bs-form-row"><label>WHAT ARE YOU INTERESTED IN?<select name="interest"><option value="">Select an option</option><option>MT5 White Label</option><option>MT5 Grey Label</option><option>MT4 White Label</option><option>CRM</option><option>Website</option><option>Liquidity</option><option>Hosting</option><option>Turnkey</option><option>API</option><option>Other</option></select></label><label>WHAT STAGE IS YOUR BUSINESS AT?<select name="stage"><option value="">Select your stage</option><option>Planning</option><option>Preparing to Launch</option><option>Existing Broker</option><option>Scaling</option></select></label></div>
<label>MESSAGE<textarea name="message" required minlength="10" maxlength="4000" rows="4" placeholder="Tell us about your brokerage plans…"></textarea></label>
<div class="bs-honeypot" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
<button class="bs-form-submit" type="submit">Request a Consultation <span aria-hidden="true">↗</span></button>
<p class="bs-form-status" role="status" aria-live="polite"></p><small>Fields marked * are required. Please do not share passwords, credentials or sensitive financial details.</small></form>
